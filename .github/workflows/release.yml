name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 也支持在 GitHub 网页上手动点击触发

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            arch: "aarch64"
          # macOS Intel
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            arch: "x64"
          # Windows x64
          - platform: "windows-latest"
            args: ""
            arch: "x64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # whisper.cpp 需要 cmake；macOS 自带，Windows 用 runner 自带的
      - name: 安装 cmake (Ubuntu/通用保险)
        if: matrix.platform == 'macos-latest'
        run: brew install cmake || true

      # Windows 上 whisper-rs-sys 用 bindgen 生成绑定，需要 libclang (LLVM)
      - name: 安装 LLVM (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Rust 质量检查 (clippy)
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Rust 测试
        run: cargo test
        working-directory: src-tauri

      - name: 安装前端依赖
        run: npm ci

      - name: 前端单元测试
        run: npm run test:frontend

      # Python 协议测试：fw/vocal 服务 + demucs 启动屏障（含 argv 重组回归测试）。
      # 参数错位这类问题必须在发布前被抓住，而不是进入安装包。
      # Windows runner 镜像已不再自带 PATH 上的 python（windows-2022 起），
      # 必须显式安装解释器，否则 Windows 腿会以 command not found 失败
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 协议测试
        shell: bash
        run: |
          PY=python
          [[ "$RUNNER_OS" == "macOS" ]] && PY=python3
          $PY python/test_fw_server.py
          $PY python/test_vocal_server.py
          $PY python/test_demucs_barrier.py

      # GitHub 不允许同名覆盖 release 资产：修复构建失败后重跑 workflow 时，同一
      # draft release 里仍留着上次上传的同名资产，tauri-action 上传会报 422
      # already_exists。先删掉本腿将上传的同名旧资产（三条腿资产名互不相同，互不影响）。
      - name: 清理同名旧资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRODUCT=$(node -p "require('./src-tauri/tauri.conf.json').productName")
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "${{ matrix.platform }}" in
            windows-latest) ASSET="${PRODUCT}_${VERSION}_${{ matrix.arch }}-setup.exe" ;;
            macos-latest)   ASSET="${PRODUCT}_${VERSION}_${{ matrix.arch }}.dmg" ;;
          esac
          echo "release: ${{ github.ref_name }} / asset: $ASSET"
          gh release delete-asset "${{ github.ref_name }}" "$ASSET" -y 2>/dev/null \
            || echo "no existing asset, skip"

      - name: 编译并打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "译幕 ${{ github.ref_name }}"
          releaseBody: "下载下方对应平台的安装包：Windows 用 .exe，macOS 用 .dmg。"
          releaseDraft: true
          args: ${{ matrix.args }}
