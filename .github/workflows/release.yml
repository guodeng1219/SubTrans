name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # 也支持在 GitHub 网页上手动点击触发

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          # macOS Intel
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          # Windows x64
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # whisper.cpp 需要 cmake；macOS 自带，Windows 用 runner 自带的
      - name: 安装 cmake (Ubuntu/通用保险)
        if: matrix.platform == 'macos-latest'
        run: brew install cmake || true

      # Windows 上 whisper-rs-sys 用 bindgen 生成绑定，需要 libclang (LLVM)
      - name: 安装 LLVM (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install llvm -y
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Rust 质量检查 (clippy)
        run: cargo clippy --no-deps -- -D warnings
        working-directory: src-tauri

      - name: Rust 测试
        run: cargo test
        working-directory: src-tauri

      - name: 安装前端依赖
        run: npm install

      - name: 编译并打包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "字幕翻译工具 ${{ github.ref_name }}"
          releaseBody: "下载下方对应平台的安装包：Windows 用 .exe，macOS 用 .dmg。"
          releaseDraft: true
          args: ${{ matrix.args }}
